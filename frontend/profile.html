<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BookShelf</title>
    <link rel="stylesheet" href="/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="dark-mode oled-theme profile-page">

    <div class="profile-container">
        <!-- Header -->
        <header class="profile-header">
            <a href="/" class="back-to-home">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span id="txt-back-library">Library</span>
            </a>
            <div class="user-info">
                <div class="user-avatar-large" id="avatar-initials">?</div>
                <div class="user-meta">
                    <h2 id="user-email">...</h2>
                    <span id="user-status" class="status-badge">...</span>
                </div>
            </div>
            <div class="credits-badge" title="Your Balance">
                <span class="credits-icon">💎</span>
                <span id="user-credits" class="credits-value">0</span>
                <span class="credits-label">Credits</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="profile-grid">
            <!-- Sidebar: Account Stats -->
            <aside class="profile-sidebar">
                <div class="glass-panel stat-card">
                    <div class="stat-item">
                        <label id="txt-member-since">Member Since</label>
                        <span id="join-date">...</span>
                    </div>
                    <div class="stat-item">
                        <label id="txt-id">ID</label>
                        <span id="member-id">#000</span>
                    </div>
                </div>

                <div class="glass-panel settings-card">
                    <h3>Settings</h3>
                    <div class="setting-item">
                        <div class="setting-info">
                            <label id="txt-email-notif">Email Notifications</label>
                            <span class="bonus-hint" id="notif-bonus-label">+10 bonus for enabling</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="notif-toggle">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    
                    <button id="logout-btn" class="btn-secondary logout-btn">
                        <span>Logout</span>
                    </button>

                    <button id="nav-feedback-trigger" class="btn-secondary" style="width: 100%; margin-top: 0.5rem; justify-content: center; display: flex; align-items: center; gap: 0.5rem;">
                        <span id="txt-nav-feedback">Feedback</span>
                    </button>

                    <button id="delete-btn" class="btn-danger-minimal">
                        <span>Delete Account</span>
                    </button>
                </div>
            </aside>

            <!-- Main: Contributions -->
            <section class="profile-main">
                <div class="profile-tabs" style="display: flex; gap: 1rem; border-bottom: 1px solid var(--glass-border); margin-bottom: 1rem; padding-bottom: 0.5rem; flex-wrap: wrap; align-items: center;">
                    <button id="tab-library" class="tab-btn active" style="background: none; border: none; color: white; font-weight: 600; cursor: pointer; padding: 0.5rem 1rem; border-bottom: 2px solid var(--emerald-primary);">
                        <span id="txt-my-library">My Library</span>
                    </button>
                    <button id="tab-uploads" class="tab-btn" style="background: none; border: none; color: var(--text-dim); font-weight: 400; cursor: pointer; padding: 0.5rem 1rem;">
                        <span id="txt-my-uploads">My Uploads</span>
                    </button>
                    
                    <div style="margin-left: auto;">
                        <label for="file-input" class="btn-primary btn-mini upload-trigger">
                            <span>+ Upload EPUB</span>
                        </label>
                        <input type="file" id="file-input" accept=".epub" style="display: none;">
                    </div>
                </div>
                
                <div id="upload-status" class="upload-status-box" style="display: none;"></div>

                <div id="my-books-grid" class="mini-grid">
                    <div class="loading">Loading...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="modal-overlay">
        <div class="feedback-content glass-panel">
            <div class="modal-header">
                <h3 id="txt-feedback-title">Send Feedback</h3>
                <button id="close-feedback-modal" class="close-btn">&times;</button>
            </div>
            <p id="txt-feedback-subtitle">We'd love to hear your thoughts!</p>
            <form id="feedback-form">
                <textarea id="fb-message" placeholder="What's on your mind?" required></textarea>
                <button type="submit" class="btn-primary" id="txt-submit-feedback">Submit Feedback</button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    
    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <h3 class="modal-title" id="modal-title">Confirm</h3>
            <p class="modal-text" id="modal-text">Are you sure?</p>
            <div class="modal-actions">
                <button class="btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn-primary" id="modal-confirm" style="background: var(--danger); color: white;">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { translations } from './translations.js';
        const currentLang = localStorage.getItem('lang') || 'uk';
        const t = (key) => translations[currentLang][key] || key;

        function applyLanguage() {
            const ids = {
                'txt-back-library': 'backToLibrary',
                'txt-member-since': 'joinDate',
                'txt-email-notif': 'emailNotifications',
                'txt-my-library': 'myLibrary',
                'txt-my-uploads': 'myUploads',
                'txt-nav-feedback': 'navFeedback',
                'txt-feedback-title': 'feedbackTitle',
                'txt-feedback-subtitle': 'feedbackSubtitle',
                'txt-submit-feedback': 'submitFeedback'
            };
            for (const [id, key] of Object.entries(ids)) {
                const el = document.getElementById(id);
                if (el) el.innerText = t(key);
            }
            document.querySelector('#logout-btn span').innerText = t('logout');
            document.querySelector('#delete-btn span').innerText = t('deleteAccount');
            document.querySelector('.upload-trigger span').innerText = t('uploadNewBook');
        }

        async function loadProfile() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const userRes = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (userRes.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                    return;
                }

                const user = await userRes.json();
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('user-status').textContent = user.is_verified ? t('verifiedMember') : t('pendingVerification');
                document.getElementById('avatar-initials').textContent = user.email[0].toUpperCase();
                document.getElementById('join-date').textContent = new Date(user.created_at).toLocaleDateString();
                document.getElementById('member-id').textContent = `#${user.id.toString().padStart(3, '0')}`;
                document.getElementById('user-credits').textContent = user.credits;
                
                const notifToggle = document.getElementById('notif-toggle');
                notifToggle.checked = user.email_notifications;
                
                if (user.received_notif_bonus) {
                    document.getElementById('notif-bonus-label').innerHTML = `<span style="color:var(--emerald-primary);">${t('notifEnabled')}</span>`;
                }

                initTabs();
            } catch (err) {
                console.error(err);
            }
        }

        let activeTab = 'library';

        function initTabs() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('tab') === 'uploads') {
                activeTab = 'uploads';
            } else {
                activeTab = 'library';
            }
            
            document.getElementById('tab-library').onclick = () => switchTab('library');
            document.getElementById('tab-uploads').onclick = () => switchTab('uploads');
            
            switchTab(activeTab);
        }

        function switchTab(tab) {
            activeTab = tab;
            const libBtn = document.getElementById('tab-library');
            const upBtn = document.getElementById('tab-uploads');
            
            if (tab === 'library') {
                libBtn.style.color = 'white';
                libBtn.style.fontWeight = '600';
                libBtn.style.borderBottom = '2px solid var(--emerald-primary)';
                
                upBtn.style.color = 'var(--text-dim)';
                upBtn.style.fontWeight = '400';
                upBtn.style.borderBottom = 'none';
                
                loadMyBooks('/api/books/library');
            } else {
                upBtn.style.color = 'white';
                upBtn.style.fontWeight = '600';
                upBtn.style.borderBottom = '2px solid var(--emerald-primary)';
                
                libBtn.style.color = 'var(--text-dim)';
                libBtn.style.fontWeight = '400';
                libBtn.style.borderBottom = 'none';
                
                loadMyBooks('/api/books/my');
            }
            
            window.history.replaceState({}, '', `?tab=${tab}`);
        }

        async function loadMyBooks(endpoint) {
            const token = localStorage.getItem('token');
            document.getElementById('my-books-grid').innerHTML = '<div class="loading">Loading...</div>';
            const res = await fetch(endpoint, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const books = await res.json();
            
            const grid = document.getElementById('my-books-grid');
            grid.innerHTML = '';
            
            if (books.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 3rem;">${t('noContributionsYet')}</p>`;
                return;
            }

            books.reverse().forEach(book => {
                const card = document.createElement('div');
                card.className = 'mini-book-card';
                const coverHtml = book.cover_filepath 
                    ? `<img src="${book.cover_filepath}" class="mini-cover" alt="">`
                    : `<div class="mini-cover" style="display:flex; align-items:center; justify-content:center; font-size:2rem; background:var(--velvet-deep);">📖</div>`;
                
                let actionHtml = '';
                if (activeTab === 'library') {
                    actionHtml = `<div style="margin-top:0.5rem;"><button class="btn-primary btn-mini" style="width:100%; display:flex; justify-content:center; gap:0.5rem; align-items:center;" onclick="window.location.href='/api/books/download/${book.id}/user?token=${token}'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download</button></div>`;
                }

                card.innerHTML = `
                    <span class="status-badge status-${book.status}">${t(book.status)}</span>
                    ${coverHtml}
                    <div class="mini-title">${book.title}</div>
                    ${actionHtml}
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('upload-status');
            status.style.display = 'block';
            status.innerHTML = `<span style="color: var(--emerald-glow);">${t('preparingUpload')}: ${file.name}...</span>`;

            const formData = new FormData();
            formData.append('file', file);

            const token = localStorage.getItem('token');
            try {
                const res = await fetch('/api/books/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                const data = await res.json();
                if (res.ok) {
                    status.innerHTML = `<span style="color: var(--emerald-primary);">✅ ${t('uploadSuccess')}</span>`;
                    switchTab('uploads');
                    setTimeout(() => { status.style.display = 'none'; }, 3000);
                } else {
                    status.innerHTML = `<span style="color: var(--danger);">❌ ${data.detail || t('uploadError')}</span>`;
                }
            } catch (err) {
                status.innerHTML = `<span style="color: var(--danger);">❌ ${t('connectionError')}</span>`;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        });

        document.getElementById('notif-toggle').addEventListener('change', async (e) => {
            const enabled = e.target.checked;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch('/api/auth/notifications', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ enabled })
                });
                if (res.ok) {
                    loadProfile();
                }
            } catch (err) { console.error(err); }
        });

        async function showConfirm(title, text, confirmText = t('confirm'), isDanger = false) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirm-modal');
                const titleEl = document.getElementById('modal-title');
                const textEl = document.getElementById('modal-text');
                const confirmBtn = document.getElementById('modal-confirm');
                const cancelBtn = document.getElementById('modal-cancel');

                titleEl.textContent = title;
                textEl.textContent = text;
                confirmBtn.textContent = confirmText;
                confirmBtn.style.background = isDanger ? 'var(--danger)' : 'var(--emerald-primary)';
                confirmBtn.style.color = isDanger ? 'white' : 'black';

                modal.style.display = 'flex';

                const close = (res) => {
                    modal.style.display = 'none';
                    confirmBtn.onclick = null;
                    cancelBtn.onclick = null;
                    resolve(res);
                };

                confirmBtn.onclick = () => close(true);
                cancelBtn.onclick = () => close(false);
            });
        }

        document.getElementById('delete-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const confirmed = await showConfirm(t('deleteAccountQuestion'), t('deleteAccountWarning'), t('deleteForever'), true);
            if (!confirmed) return;
            const secondConfirm = await showConfirm(t('lastWarning'), t('absoluteCertainty'), t('yesDelete'), true);
            if (!secondConfirm) return;

            const token = localStorage.getItem('token');
            try {
                const res = await fetch('/api/auth/me', {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    localStorage.removeItem('token');
                    window.location.href = 'index.html';
                }
            } catch (err) { console.error(err); }
        });

        // Feedback Logic
        document.getElementById('nav-feedback-trigger').addEventListener('click', () => {
            document.getElementById('feedback-modal').classList.add('active');
        });

        document.getElementById('close-feedback-modal').addEventListener('click', () => {
            document.getElementById('feedback-modal').classList.remove('active');
        });

        document.getElementById('feedback-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = document.getElementById('fb-message').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.innerText = t('sharingThoughts');

            try {
                const res = await fetch('/api/feedback/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                if (res.ok) {
                    document.getElementById('fb-message').value = '';
                    showToast(t('feedbackSubmitted'));
                    document.getElementById('feedback-modal').classList.remove('active');
                }
            } catch (err) { console.error(err); }
            finally {
                submitBtn.disabled = false;
                submitBtn.innerText = t('submitFeedback');
            }
        });

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        applyLanguage();
        loadProfile();
    </script>
</body>
</html>
