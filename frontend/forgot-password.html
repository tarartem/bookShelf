<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BookShelf</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at top right, var(--velvet-deep), var(--oled-black));
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 3rem;
            text-align: center;
        }
        .auth-header h1 { font-family: var(--font-serif); margin-bottom: 0.5rem; color: white; }
        .auth-header p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
        .form-control { width: 100%; margin-bottom: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 0.8rem; color: white; outline: none; }
        .btn-auth { width: 100%; background: var(--emerald-primary); color: black; border: none; border-radius: 12px; padding: 1rem; font-weight: 700; cursor: pointer; }
        .success-message { color: var(--emerald-glow); display: none; margin-top: 1.5rem; }
    </style>
</head>
<body class="oled-theme">
    <div class="auth-container">
        <div class="auth-card">
            <div id="form-container">
                <div class="auth-header">
                    <h1>Reset Password</h1>
                    <p>Enter your email and we'll send you a recovery link.</p>
                </div>
                <form id="forgot-form">
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                    <button type="submit" class="btn-auth">Send Reset Link</button>
                </form>
                <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
                    <a href="login.html" style="color: var(--emerald-glow); text-decoration: none; font-size: 0.9rem; font-weight: 600;">Back to Login</a>
                    <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.8rem;">Повернутися до каталогу</a>
                </div>
            </div>
            <div id="success" class="success-message">
                <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">📧</span>
                <p>If an account exists for <strong><span id="target-email"></span></strong>, a recovery link has been sent. Please check your inbox.</p>
                <div style="margin-top: 2rem;">
                    <a href="login.html" class="btn-auth" style="display: block; text-decoration: none;">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            document.getElementById('target-email').textContent = email;

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (res.ok) {
                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('success').style.display = 'block';
                    alert("Dev Mode: Since SMTP is not configured locally, check your Terminal/Console where the server is running to get the reset token!");
                }
            } catch (err) { alert('Connection error.'); }
        });
    </script>
</body>
</html>
