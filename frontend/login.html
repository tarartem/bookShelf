<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back - BookShelf</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page oled-theme">
    <div class="auth-container">
        <div style="position: absolute; top: 2rem; left: 2rem; z-index: 10;">
            <button onclick="window.location.href='index.html'" class="btn-secondary" style="padding: 0.5rem 1rem; border-radius: 12px; display:flex; align-items:center; gap:0.5rem; cursor: pointer;">
                <span id="txt-back">← Back</span>
            </button>
        </div>
        
        <div class="auth-card">
            <div class="auth-header">
                <h1 id="txt-login-title">Welcome Back</h1>
                <p id="txt-login-subtitle">Sign in to your library</p>
            </div>

            <div id="error-box" class="error-message"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email" id="txt-email-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password" id="txt-password-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-auth" id="txt-login-btn">Login</button>
            </form>

            <div class="auth-footer">
                <span id="txt-no-account">New to BookShelf?</span> <a href="signup.html" id="txt-signup-link">Create Account</a><br><br>
                <a href="forgot-password.html" id="txt-forgot-password" style="font-size: 0.8rem; opacity: 0.8;">Forgot Password?</a><br><br>
                <a href="index.html" id="txt-back-catalog" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: none;">Back to Catalog</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { translations } from './translations.js';
        const currentLang = localStorage.getItem('lang') || 'uk';
        const t = (key) => translations[currentLang][key] || key;

        function applyLanguage() {
            const ids = {
                'txt-back': 'back',
                'txt-login-title': 'welcomeBack',
                'txt-login-subtitle': 'loginSubtitle',
                'txt-email-label': 'emailAddress',
                'txt-password-label': 'password',
                'txt-login-btn': 'login',
                'txt-no-account': 'newToBookshelf',
                'txt-signup-link': 'createAccount',
                'txt-forgot-password': 'forgotPassword',
                'txt-back-catalog': 'backToCatalog'
            };
            for (const [id, key] of Object.entries(ids)) {
                const el = document.getElementById(id);
                if (el) el.innerText = t(key);
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');

            if (email === 'admin@bookshelf.com' && password === '!!BookShelf1099') {
                localStorage.setItem('admin_auth', 'Basic ' + btoa(email + ':' + password));
                window.location.href = 'admin.html';
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.access_token) {
                        localStorage.setItem('token', data.access_token);
                        window.location.href = 'index.html';
                    }
                } else {
                    errorBox.textContent = data.detail || t('loginError');
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = t('connectionError');
                errorBox.style.display = 'block';
            }
        });

        applyLanguage();
    </script>
</body>
</html>
