<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новий пароль - BookShelf</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at top right, var(--velvet-deep), var(--oled-black));
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 3rem;
            text-align: center;
        }
        .auth-header h1 { font-family: var(--font-serif); margin-bottom: 0.5rem; color: white; }
        .auth-header p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
        .form-control { width: 100%; margin-bottom: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 0.8rem; color: white; outline: none; }
        .btn-auth { width: 100%; background: var(--emerald-primary); color: black; border: none; border-radius: 12px; padding: 1rem; font-weight: 700; cursor: pointer; }
        .error-box { color: var(--danger); background: rgba(239, 68, 68, 0.1); padding: 0.8rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.5rem; display: none; }
        .success-message { color: var(--emerald-primary); display: none; margin-top: 1.5rem; }
    </style>
</head>
<body class="oled-theme">
    <div class="auth-container">
        <div class="auth-card">
            <div id="form-container">
                <div class="auth-header">
                    <h1>Новий пароль</h1>
                    <p>Введіть свій новий надійний пароль.</p>
                </div>
                <div id="error-box" class="error-box"></div>
                <form id="reset-form">
                    <input type="password" id="password" class="form-control" placeholder="Новий пароль (мін. 8 симв.)" required minlength="8">
                    <input type="password" id="confirm" class="form-control" placeholder="Підтвердіть новий пароль" required>
                    <button type="submit" class="btn-auth">Оновити пароль</button>
                </form>
            </div>
            <div id="success" class="success-message">
                <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">✨</span>
                <h2>Пароль оновлено!</h2>
                <p style="margin-top: 1rem; color: var(--text-muted);">Тепер ви можете увійти зі своїм новим паролем.</p>
                <div style="margin-top: 2rem;">
                    <a href="login.html" class="btn-auth" style="display: block; text-decoration: none;">Увійти</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const errorBox = document.getElementById('error-box');

            if (password !== confirm) {
                errorBox.textContent = "Паролі не співпадають.";
                errorBox.style.display = 'block';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                errorBox.textContent = "Недійсне посилання для відновлення (відсутній токен).";
                errorBox.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: password })
                });

                if (res.ok) {
                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('success').style.display = 'block';
                } else {
                    const data = await res.json();
                    errorBox.textContent = data.detail || "Не вдалося скинути пароль.";
                    errorBox.style.display = 'block';
                }
            } catch (err) { errorBox.textContent = "Помилка з'єднання."; errorBox.style.display = 'block'; }
        });
    </script>
</body>
</html>
