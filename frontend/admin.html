<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін - Консоль BookShelf</title>
    <link rel="stylesheet" href="/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 2rem;
        }
        .bento-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .bento-stat-card {
            padding: 2rem;
            text-align: center;
        }
        .bento-stat-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--emerald-glow);
            margin: 0.5rem 0;
            font-family: var(--font-serif);
        }
        .admin-nav-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }
        .tab-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-dim);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--emerald-primary);
            color: black;
        }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Books & Feedback Lists */
        .admin-card-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            transition: 0.3s;
        }
        .admin-card-item:hover {
            border-color: var(--emerald-primary);
            background: rgba(16, 185, 129, 0.05);
        }
        
        .feedback-bubble {
            background: rgba(255,255,255,0.03);
            padding: 1.5rem;
            border-radius: 24px;
            margin-bottom: 1rem;
            position: relative;
        }
        .feedback-bubble.new { border-left: 4px solid var(--emerald-primary); }
        
        @media (max-width: 900px) {
            .bento-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="oled-theme">
    <div class="top-nav-island" id="site-header" style="justify-content: space-between;">
        <div style="display:flex; align-items:center; gap:1.5rem;">
            <button onclick="window.location.href='/'" class="btn-secondary" style="padding: 0.5rem 1rem; border-radius: 12px; display:flex; align-items:center; gap:0.5rem; color: var(--text-dim); cursor: pointer;">
                <span>←</span> Назад
            </button>
            <div class="header-brand" style="cursor: pointer;" onclick="window.location.href='/'">
                <img src="/assets/logo.png" alt="Logo" style="height: 32px; width: 32px; border-radius: 8px;">
                <h1 style="font-size: 1.2rem;">BookShelf <span style="font-size: 0.8rem; color: var(--emerald-glow); opacity: 0.8; margin-left: 0.5rem;">Адмін</span></h1>
            </div>
        </div>
        <button onclick="localStorage.removeItem('admin_auth'); window.location.href='/login.html';" class="btn-secondary" style="padding: 0.5rem 1rem; border-radius: 12px; font-size: 0.8rem;">Вийти</button>
    </div>

    <div class="admin-container">
        <!-- Bento Stats -->
        <section class="bento-stats">
            <div class="glass-panel bento-stat-card">
                <p style="color: var(--text-dim); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Розмір бібліотеки</p>
                <div id="total-books-count" class="bento-stat-value">...</div>
                <p style="font-size: 0.9rem;">Всього томів</p>
            </div>
            <div class="glass-panel bento-stat-card">
                <p style="color: var(--text-dim); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Читацька аудиторія</p>
                <div id="total-sends-count" class="bento-stat-value">...</div>
                <p style="font-size: 0.9rem;">Відправлено книг</p>
            </div>
            <div class="glass-panel bento-stat-card">
                <p style="color: var(--text-dim); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Пульс користувачів</p>
                <div id="total-feedback-count" class="bento-stat-value">...</div>
                <p style="font-size: 0.9rem;">Отримано повідомлень</p>
            </div>
        </section>

        <!-- Navigation Tabs -->
        <div class="admin-nav-tabs">
            <button class="tab-btn active" onclick="switchPanel('books')">Керування бібліотекою</button>
            <button class="tab-btn" onclick="switchPanel('contributions')">Перевірка внесків <span id="contributions-badge" style="background: var(--danger); color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.7rem; margin-left: 5px; display:none;">0</span></button>
            <button class="tab-btn" onclick="switchPanel('history')">Історія завантажень</button>
            <button class="tab-btn" onclick="switchPanel('users')">Користувачі</button>
            <button class="tab-btn" onclick="switchPanel('feedback')">Голоси користувачів</button>
        </div>

        <!-- Library Panel -->
        <section id="panel-books" class="admin-panel active">
            <div class="glass-panel" style="padding: 2rem; border-radius: 24px; margin-bottom: 2rem;">
                <h3 style="margin-bottom: 1rem;">Імпорт нових книг</h3>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <input type="file" id="epub-input" accept=".epub" multiple style="flex: 1; padding: 1rem; background: rgba(0,0,0,0.2); border: 1px dashed var(--glass-border); border-radius: 12px;">
                    <button id="upload-btn" class="btn-primary">Завантажити epub</button>
                </div>
                <div id="upload-status" style="margin-top: 1rem; font-size: 0.9rem;"></div>
            </div>

            <div id="admin-books-list">
                <!-- Books will be loaded here -->
            </div>
        </section>

        <!-- Contributions Panel -->
        <section id="panel-contributions" class="admin-panel">
            <div id="contributions-list">
                <!-- Contributions will be loaded here -->
            </div>
        </section>

        <!-- History Panel -->
        <section id="panel-history" class="admin-panel">
            <div id="history-list">
                <!-- Comprehensive upload history here -->
            </div>
        </section>

        <!-- Users Panel -->
        <section id="panel-users" class="admin-panel">
            <div id="users-list">
                <!-- User list will be loaded here -->
            </div>
        </section>

        <!-- Feedback Panel -->
        <section id="panel-feedback" class="admin-panel">
            <div id="feedback-list">
                <!-- Feedback will be loaded here -->
            </div>
        </section>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title" id="modal-title">Підтвердження</h3>
            <p class="modal-text" id="modal-text">Ви впевнені?</p>
            <div class="modal-actions">
                <button class="btn-secondary" id="modal-cancel" style="padding: 0.8rem 1.5rem; border-radius: 12px; cursor:pointer;">Скасувати</button>
                <button class="btn-primary" id="modal-confirm" style="padding: 0.8rem 1.5rem; border-radius: 12px; background: var(--emerald-primary); color: black; cursor:pointer;">Підтвердити</button>
            </div>
        </div>
    </div>

    <script type="module" src="/admin.js"></script>
    <script>
        function switchPanel(panelId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
            
            const btn = document.querySelector(`[onclick="switchPanel('${panelId}')"]`);
            btn.classList.add('active');
            document.getElementById(`panel-${panelId}`).classList.add('active');
        }
        window.switchPanel = switchPanel;
    </script>
</body>
</html>
