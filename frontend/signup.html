<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join BookShelf - Create Account</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at top right, var(--velvet-deep), var(--oled-black));
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 3rem;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .auth-header h1 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            background: linear-gradient(135deg, #fff, var(--emerald-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .auth-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }
        .form-control {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.1);
            border-color: var(--emerald-primary);
            box-shadow: 0 0 0 4px var(--glass-glow);
        }
        .btn-auth {
            width: 100%;
            background: var(--emerald-primary);
            color: black;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--glass-glow);
            background: var(--emerald-glow);
        }
        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .auth-footer a {
            color: var(--emerald-glow);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
        }
        .success-message {
            color: var(--emerald-glow);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body class="oled-theme">
    <div class="auth-container">
        <div style="position: absolute; top: 2rem; left: 2rem;">
            <button onclick="window.location.href='index.html'" class="btn-secondary" style="padding: 0.5rem 1rem; border-radius: 12px; display:flex; align-items:center; gap:0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-dim); cursor: pointer;">
                <span>←</span> Назад
            </button>
        </div>
        <div class="auth-card">
            <div id="signup-form-container">
                <div class="auth-header">
                    <h1>Join the Club</h1>
                    <p>Create your personal library account</p>
                </div>

                <div id="error-box" class="error-message"></div>

                <form id="signup-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn-auth">Create Account</button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Sign In</a><br><br>
                    <a href="index.html" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: none;">Повернутися до каталогу</a>
                </div>
            </div>

            <div id="success-container" class="success-message">
                <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">✉️</span>
                <h3>Check your email!</h3>
                <p style="margin-top: 1rem; font-size: 0.95rem; color: var(--text-muted);">
                    We've sent a verification link to your inbox. <br>Please verify your account to start reading.
                </p>
                <div style="margin-top: 2rem;">
                    <a href="index.html" class="btn-auth" style="display: block; text-decoration: none;">Back to Library</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const errorBox = document.getElementById('error-box');

            if (password !== confirm) {
                errorBox.textContent = "Passwords do not match.";
                errorBox.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('signup-form-container').style.display = 'none';
                    document.getElementById('success-container').style.display = 'block';
                } else {
                    errorBox.textContent = data.detail || "Signup failed. Please try again.";
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = "Connection error. Is the server running?";
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
