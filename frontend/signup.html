<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join BookShelf - Create Account</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page oled-theme">
    <div class="auth-container">
        <div style="position: absolute; top: 2rem; left: 2rem; z-index: 10;">
            <button onclick="window.location.href='index.html'" class="btn-secondary" style="padding: 0.5rem 1rem; border-radius: 12px; display:flex; align-items:center; gap:0.5rem; cursor: pointer;">
                <span id="txt-back">← Back</span>
            </button>
        </div>

        <div class="auth-card">
            <div id="signup-form-container">
                <div class="auth-header">
                    <h1 id="txt-signup-title">Join Us</h1>
                    <p id="txt-signup-subtitle">Create your personal library account</p>
                </div>

                <div id="error-box" class="error-message"></div>

                <form id="signup-form">
                    <div class="form-group">
                        <label for="email" id="txt-email-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password" id="txt-password-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password" id="txt-confirm-label">Confirm Password</label>
                        <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn-auth" id="txt-signup-btn">Create Account</button>
                </form>

                <div class="auth-footer">
                    <span id="txt-have-account">Already have an account?</span> <a href="login.html" id="txt-login-link">Login</a><br><br>
                    <a href="index.html" id="txt-back-catalog" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: none;">Back to Catalog</a>
                </div>
            </div>

            <div id="success-container" class="success-message">
                <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">✉️</span>
                <h3 id="txt-check-mail">Check your email!</h3>
                <p id="txt-check-mail-desc" style="margin-top: 1rem; font-size: 0.95rem; color: var(--text-muted);">
                    We've sent a verification link to your email. Please verify your account to start reading.
                </p>
                <div style="margin-top: 2rem;">
                    <a href="index.html" class="btn-auth" id="txt-back-catalog-success">Back to Catalog</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { translations } from './translations.js';
        const currentLang = localStorage.getItem('lang') || 'uk';
        const t = (key) => translations[currentLang][key] || key;

        function applyLanguage() {
            const ids = {
                'txt-back': 'back',
                'txt-signup-title': 'joinUs',
                'txt-signup-subtitle': 'signupSubtitle',
                'txt-email-label': 'emailAddress',
                'txt-password-label': 'password',
                'txt-confirm-label': 'confirmPassword',
                'txt-signup-btn': 'createAccount',
                'txt-have-account': 'alreadyHaveAccount',
                'txt-login-link': 'login',
                'txt-back-catalog': 'backToCatalog',
                'txt-check-mail': 'checkYourEmail',
                'txt-check-mail-desc': 'verificationSent',
                'txt-back-catalog-success': 'backToCatalog'
            };
            for (const [id, key] of Object.entries(ids)) {
                const el = document.getElementById(id);
                if (el) el.innerText = t(key);
            }
        }

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const errorBox = document.getElementById('error-box');

            if (password !== confirm) {
                errorBox.textContent = t('passwordsDoNotMatch');
                errorBox.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('signup-form-container').style.display = 'none';
                    document.getElementById('success-container').style.display = 'block';
                } else {
                    errorBox.textContent = data.detail || t('signupError');
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = t('connectionError');
                errorBox.style.display = 'block';
            }
        });

        applyLanguage();
    </script>
</body>
</html>
